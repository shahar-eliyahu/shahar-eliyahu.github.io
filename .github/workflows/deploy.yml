# Builds the Eleventy site and publishes the generated _site/ folder to GitHub
# Pages. Requires Settings > Pages > Source = "GitHub Actions" (see README >
# Deployment). This is a root-domain user site, so no base path is needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Re-run a deployment from the Actions tab without a new commit
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one finishes, the newest one goes next
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
